name: Family sync reliability

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run family sync tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Run mobile browser smoke
        run: npm run test:e2e
